# Fly.io: `fly launch --no-deploy --copy-config`, then `fly volumes create faxal_data --size 1`, then `fly deploy`
app = "faxal"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[mounts]
  source = "faxal_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.checks]
    [http_service.checks.health]
      path = "/api/health"
      interval = "30s"
      timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
